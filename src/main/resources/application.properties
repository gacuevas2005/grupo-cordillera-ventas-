spring.datasource.url=jdbc:postgresql://localhost:5432/db_ventas_cordillera
spring.datasource.username=postgres
spring.datasource.password=12345
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
logging.level.org.springframework.security=DEBUG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

# 1. Activar Circuit Breaker en Feign
spring.cloud.openfeign.circuitbreaker.enabled=false

# 2. Configuración para el cliente de Sucursales
resilience4j.circuitbreaker.instances.ms-sucursales.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-sucursales.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-sucursales.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-sucursales.permitted-number-of-calls-in-half-open-state=3


# Configuración para el cliente de Stock (ms-stock)
resilience4j.circuitbreaker.instances.ms-stock.sliding-window-size=6
resilience4j.circuitbreaker.instances.ms-stock.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-stock.wait-duration-in-open-state=15s

# Configuración para el cliente de Productos (ms-productos)
resilience4j.circuitbreaker.instances.ms-productos.sliding-window-size=4
resilience4j.circuitbreaker.instances.ms-productos.failure-rate-threshold=50
